name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - run: ruff check .

  test:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            tests/requirements.txt
      # The tests import the desktop's ws_client/shares modules (no Qt needed),
      # whose only third-party dependency, websockets, is pinned identically in
      # server/requirements.txt.
      - run: pip install -r server/requirements.txt -r tests/requirements.txt
      - run: python -m pytest tests -v

  docker:
    name: Server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --pull -t instasend-server:ci server
      - name: Smoke test container
        run: |
          docker run -d --name srv -p 8000:8000 \
            -e TOKEN=$(openssl rand -hex 32) -e DB_PATH=/tmp/shares.db \
            instasend-server:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/doesnotexist || true)
            if [ "$code" = "404" ]; then echo "server up"; exit 0; fi
            sleep 1
          done
          docker logs srv
          exit 1

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            desktop/requirements.txt
            desktop/requirements-dev.txt
      - run: pip install -r desktop/requirements.txt -r desktop/requirements-dev.txt

      # Ubuntu runners lack the system libraries Qt's GUI modules link against
      # (libEGL, libGL, xkbcommon, xcb), so `import PySide6.QtGui` fails without them.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 xvfb

      - name: Import check
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import main"

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: desktop
        run: python build.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run python build.py
