version: 2

# Every ecosystem joins one multi-ecosystem group, so Dependabot opens a
# single combined PR with all pending updates (including major bumps).
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: daily

updates:
  - package-ecosystem: pip
    directories:
      - /server
      - /desktop   # requirements.txt + requirements-dev.txt
      - /tests
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker
    directory: /server   # Dockerfile
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies

  - package-ecosystem: docker-compose
    directory: /server   # docker-compose.yml
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
